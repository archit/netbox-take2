# Skyramp Workspace Configuration
workspace:
  repoName: archit/netbox-take2
  repoUrl: https://github.com/archit/netbox-take2
metadata:
  schemaVersion: v1
  executorVersion: v1.3.30
  createdAt: "2026-06-29T18:40:52.992Z"
  updatedAt: "2026-06-29T18:40:53.000Z"
services:
  - serviceName: netbox-backend
    language: python
    framework: pytest
    testDirectory: tests/skyramp
    api:
      schemaPath: contrib/openapi.json
      authType: bearer
      authHeader: Authorization
      authScheme: Bearer
      baseUrl: http://localhost:8080/api
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . up -d --build
      serverStopCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . down -v
      runtime: docker
      dockerNetwork: netbox-take2_default
